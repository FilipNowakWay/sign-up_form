<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign-up Form</title>
	<link rel="stylesheet" href="./reset.css">
	<link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="left-panel">
        <div class="banner">
            <img src="./assets/odin-logo.png" alt="odin logo image">
            <h1>ODIN</h1>
        </div>
        <footer><p>Photo by <a href="https://unsplash.com/@haliewestphoto">Hale West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></p></footer>
    </div>
    <div class="right-panel">

        <div class="welcome-text">
            <h3>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</h3>
            <h3>Sign up now to get started.</h3>
            <h3 class="specialH3">You know you want to.</h3>
        </div>
        <form>
            <div class="form-container">
                <h3 class="form-heading">Let's do this!</h3>
                <div class="form-columns">
                    <div class="col1">
                        <div class="field">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="user_first_name" required>
                        </div>
                        <div class="field">
                            <label for="mail">EMAIL</label>
                            <input type="email" id="mail" name="user_email" required>
                        </div>
                        <div class="field">
                            <label for="pass">PASSWORD</label>
                            <input type="password" id="pass" name="user_password" required>
                        </div>
                    </div>
                    <div class="col2">
                        <div class="field">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="user_last_name" required>
                        </div>
                        <div class="field">
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="tel" id="phone-number" name="user_phone_number">
                        </div>
                        <div class="field">
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm-password" name="user_confirm_password" required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bottom">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="index.html" class="log-in">Log in</a></p>
            </div>
        </form>


    </div>
</body>
</html>
